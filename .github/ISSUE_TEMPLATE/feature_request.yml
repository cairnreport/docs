name: Feature request
description: Suggest an improvement or a new capability for cairnreport.dev.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Features are specified in the specs repository before they are built (see
        [CONTRIBUTING.md](https://github.com/cairnreport/docs/blob/main/CONTRIBUTING.md#specs-first)). This issue starts that discussion.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: input
    id: requirement
    attributes:
      label: Related requirement
      description: Requirement ID (R#.#) or deferred item (D#), if you know it.
      placeholder: R6.2
    validations:
      required: false
