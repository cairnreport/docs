name: Feature request
description: Suggest an improvement or a new capability for cairnreport.dev.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest a documentation improvement or a feature you'd like to see in Cairn Report.
        The maintainers will triage it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
