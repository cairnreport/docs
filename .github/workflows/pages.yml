# Cairn Report docs site: build on PRs, build and deploy to GitHub Pages on main.
# Site code: MIT (see LICENSE).
name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Makefile pins the same versions; `make check` fails if they differ.
  # renovate: datasource=github-releases depName=gohugoio/hugo
  HUGO_VERSION: v0.169.0
  # renovate: datasource=github-releases depName=lycheeverse/lychee versioning=regex:^lychee-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
  LYCHEE_VERSION: lychee-v0.24.2

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # A new push cancels the superseded build for the same PR or branch.
    concurrency:
      group: pages-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Downloads the pinned Hugo and lychee (checksum-verified), builds with
      # --minify, checks internal links offline and audits the output for
      # scripts and external URLs. Blocking.
      - name: Build and check
        run: make check HUGO_VERSION="$HUGO_VERSION" LYCHEE_VERSION="$LYCHEE_VERSION"

      # External links: cached, and non-blocking so third-party outages do not
      # fail docs PRs. Broken links show up as a warning in the job log.
      - name: Restore link-check cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      - name: Check external links (non-blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make check-links-external LYCHEE_VERSION="$LYCHEE_VERSION"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; never cancel one that is in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
